// The Android Gradle Plugin builds the native code with the Android NDK.

group = "com.connects.vanguard_media_engine"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.connects.vanguard_media_engine"

    // Bumping the plugin compileSdk version requires all clients of this plugin
    // to bump the version in their app.
    compileSdk = 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specific NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion = android.ndkVersion

    // Invoke the shared CMake build with the Android Gradle Plugin.
    externalNativeBuild {
        cmake {
            path = "../src/CMakeLists.txt"

            // The default CMake version for the Android Gradle Plugin is 3.10.2.
            // https://developer.android.com/studio/projects/install-ndk#vanilla_cmake
            //
            // The Flutter tooling requires that developers have CMake 3.10 or later
            // installed. You should not increase this version, as doing so will cause
            // the plugin to fail to compile for some customers of the plugin.
            // version "3.10.2"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
    }

    // ── Duet green-screen: MediaPipe model asset packaging ───────────────────
    // `src/main/assets/selfie_segmenter.tflite` must stay uncompressed so the
    // MediaPipe Tasks runtime can map it directly instead of inflating a copy.
    // AGP applies noCompress at APK packaging time; declaring it here covers
    // the plugin's own packaging and documents the requirement for consuming
    // apps, which should carry the same `noCompress "tflite"` entry.
    androidResources {
        noCompress "tflite"
    }

    // Abandoned local RND prototypes and their packaging inputs excluded from
    // package builds, not production source. The Duet duet/ and diagnostics/
    // Kotlin entries below are tracked historical RND left on disk; the
    // greenscreen/ Kotlin entries excluded from compilation below, the
    // `assets/mediapipe/**` tree, and the `jniLibs` MediaPipe/OpenCV/libc++
    // native libs excluded from packaging further below (see the `packaging`
    // block after this sourceSets block) are untracked local
    // engineering/lab output from the same abandoned GPU graph prototype.
    // None of this is part of the production GreenScreen closure: the
    // production Android GreenScreen CPU Tasks path loads the committed
    // top-level `selfie_segmentation_landscape.tflite` asset (and its sibling
    // top-level .tflite assets), not `assets/mediapipe/modules/...`, and it
    // links the MediaPipe Tasks Vision AAR declared in `dependencies` below,
    // not these hand-copied jniLibs .so files.
    // Both a bare relative-path pattern and a "**/<filename>" wildcard
    // pattern are listed per Kotlin file: PatternFilterable exclude matching
    // is ANT-style, and a bare path only matches when it resolves against
    // the exact source-root-relative path, so the wildcard form is kept as a
    // defensive fallback that matches by filename regardless of which
    // source root contributes the file.
    sourceSets {
        main {
            java {
                exclude "com/connects/vanguard_media_engine/diagnostics/AndroidDuetGpuGreenScreenPipelineSmokeCoordinator.kt"
                exclude "**/AndroidDuetGpuGreenScreenPipelineSmokeCoordinator.kt"
                exclude "com/connects/vanguard_media_engine/diagnostics/AndroidDuetGpuGreenScreenVulkanPreviewSmokeCoordinator.kt"
                exclude "**/AndroidDuetGpuGreenScreenVulkanPreviewSmokeCoordinator.kt"
                exclude "com/connects/vanguard_media_engine/diagnostics/AndroidDuetTfliteGpuNativeCapabilitySmokeCoordinator.kt"
                exclude "**/AndroidDuetTfliteGpuNativeCapabilitySmokeCoordinator.kt"
                exclude "com/connects/vanguard_media_engine/diagnostics/AndroidDuetGreenScreenTasksLiveSmokeCoordinator.kt"
                exclude "**/AndroidDuetGreenScreenTasksLiveSmokeCoordinator.kt"
                exclude "com/connects/vanguard_media_engine/duet/AndroidDuetCamera2GpuGreenScreenSource.kt"
                exclude "**/AndroidDuetCamera2GpuGreenScreenSource.kt"
                exclude "com/connects/vanguard_media_engine/duet/AndroidDuetGpuGreenScreenPipeline.kt"
                exclude "**/AndroidDuetGpuGreenScreenPipeline.kt"
                exclude "com/connects/vanguard_media_engine/duet/AndroidDuetGpuTextureBridge.kt"
                exclude "**/AndroidDuetGpuTextureBridge.kt"
                exclude "com/connects/vanguard_media_engine/duet/AndroidDuetMediaPipeGpuGraphSegmentationBackend.kt"
                exclude "**/AndroidDuetMediaPipeGpuGraphSegmentationBackend.kt"
                exclude "com/connects/vanguard_media_engine/duet/AndroidDuetMediaPipeGpuGraphSession.kt"
                exclude "**/AndroidDuetMediaPipeGpuGraphSession.kt"
                exclude "com/connects/vanguard_media_engine/diagnostics/AndroidGreenScreenQuantLabSmokeCoordinator.kt"
                exclude "**/AndroidGreenScreenQuantLabSmokeCoordinator.kt"
                exclude "com/connects/vanguard_media_engine/greenscreen/AndroidGreenScreenQuantLabRecorder.kt"
                exclude "**/AndroidGreenScreenQuantLabRecorder.kt"
                exclude "com/connects/vanguard_media_engine/greenscreen/AndroidGreenScreenGpuPipeline.kt"
                exclude "**/AndroidGreenScreenGpuPipeline.kt"
                exclude "com/connects/vanguard_media_engine/greenscreen/AndroidGreenScreenGpuTextureBridge.kt"
                exclude "**/AndroidGreenScreenGpuTextureBridge.kt"
                exclude "com/connects/vanguard_media_engine/greenscreen/AndroidGreenScreenMediaPipeGpuGraphSession.kt"
                exclude "**/AndroidGreenScreenMediaPipeGpuGraphSession.kt"
            }
        }
    }

    // `sourceSets.main.{assets,jniLibs}.exclude(...)` is deliberately not used
    // for the RND assets/native-libs below: unlike `java.exclude(...)` above,
    // AGP's asset and jniLibs merge tasks (`mergeDebugAssets`,
    // `mergeDebugJniLibFolders`) do not consult those source-set exclude
    // patterns, so a source-set-level exclude silently has no effect on
    // packaged output (verified: the files still appeared in the merged
    // intermediates and final debug APK with such an exclude in place).
    // `packaging.jniLibs.excludes` below is AGP's actual native-lib
    // package-exclusion mechanism and is honored by the jniLibs packaging
    // task for this module. `packaging.resources.excludes` does NOT reach
    // the Android `assets/` merge pipeline, though, so it cannot remove
    // `assets/mediapipe/**`; that merged asset output is scrubbed instead by
    // the `merge*Assets` task hook further below.
    packaging {
        resources {
            // NOTE: this excludes from merged Java resources only; it does
            // NOT remove `assets/mediapipe/**` from the APK (verified: the
            // tree still appeared in the final APK with only this exclude in
            // place), since Android asset merging is a separate pipeline
            // from Java resources packaging. The actual scrub of the
            // untracked local RND asset tree from the abandoned MediaPipe
            // GPU graph prototype out of merged `assets/mediapipe/**` output
            // is performed by the `merge*Assets` task hook further below,
            // which leaves the committed top-level
            // `selfie_segmentation_landscape.tflite` / `selfie_segmentation.tflite`
            // / other top-level model assets declared directly under
            // `src/main/assets` packaged.
            excludes += ["mediapipe/**"]
        }
        jniLibs {
            // Untracked local RND native libs hand-copied for the same
            // abandoned MediaPipe GPU graph prototype; production
            // GreenScreen links MediaPipe Tasks Vision via the AAR
            // dependency declared in `dependencies` below instead.
            excludes += [
                "**/libmediapipe_jni.so",
                "**/libopencv_java4.so",
                "**/libc++_shared.so",
            ]
        }
    }
}

// `ignoreAssetsPatterns` on `MergeSourceSetFolders` does not remove
// `assets/mediapipe/**` from the packaged APK (verified: the tree, including
// `assets/mediapipe/modules/selfie_segmentation/...`, still appeared in the
// final APK with that property set). Instead, scrub the generated
// `merge*Assets` task output directly: after each variant's merge asset task
// runs, delete the generated `mediapipe/**` output (and the generated
// `mediapipe` directory itself) from that task's own output directories.
// This only touches generated merge output, never `android/src/main/assets`.
tasks.matching { task ->
    task.name.startsWith("merge") && task.name.endsWith("Assets")
}.configureEach { task ->
    task.doLast {
        task.outputs.files.files.each { outDir ->
            delete(fileTree(outDir) {
                include "mediapipe/**"
            })
            delete(file("${outDir}/mediapipe"))
        }
    }
}

// The `android.sourceSets.main.java.exclude(...)` above only affects AGP's
// own bookkeeping (lint, resource merging); the Kotlin Gradle plugin builds
// compileDebugKotlin's source list from its own KotlinSourceSet, which does
// not consult that exclude. KotlinCompile itself implements PatternFilterable,
// so the same exclude set (bare path + "**/<filename>" wildcard per file) is
// also applied directly on the compile tasks to keep these abandoned RND
// prototypes and GreenScreen engineering/lab files out of every variant's
// Kotlin compilation.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    exclude "com/connects/vanguard_media_engine/diagnostics/AndroidDuetGpuGreenScreenPipelineSmokeCoordinator.kt"
    exclude "**/AndroidDuetGpuGreenScreenPipelineSmokeCoordinator.kt"
    exclude "com/connects/vanguard_media_engine/diagnostics/AndroidDuetGpuGreenScreenVulkanPreviewSmokeCoordinator.kt"
    exclude "**/AndroidDuetGpuGreenScreenVulkanPreviewSmokeCoordinator.kt"
    exclude "com/connects/vanguard_media_engine/diagnostics/AndroidDuetTfliteGpuNativeCapabilitySmokeCoordinator.kt"
    exclude "**/AndroidDuetTfliteGpuNativeCapabilitySmokeCoordinator.kt"
    exclude "com/connects/vanguard_media_engine/diagnostics/AndroidDuetGreenScreenTasksLiveSmokeCoordinator.kt"
    exclude "**/AndroidDuetGreenScreenTasksLiveSmokeCoordinator.kt"
    exclude "com/connects/vanguard_media_engine/duet/AndroidDuetCamera2GpuGreenScreenSource.kt"
    exclude "**/AndroidDuetCamera2GpuGreenScreenSource.kt"
    exclude "com/connects/vanguard_media_engine/duet/AndroidDuetGpuGreenScreenPipeline.kt"
    exclude "**/AndroidDuetGpuGreenScreenPipeline.kt"
    exclude "com/connects/vanguard_media_engine/duet/AndroidDuetGpuTextureBridge.kt"
    exclude "**/AndroidDuetGpuTextureBridge.kt"
    exclude "com/connects/vanguard_media_engine/duet/AndroidDuetMediaPipeGpuGraphSegmentationBackend.kt"
    exclude "**/AndroidDuetMediaPipeGpuGraphSegmentationBackend.kt"
    exclude "com/connects/vanguard_media_engine/duet/AndroidDuetMediaPipeGpuGraphSession.kt"
    exclude "**/AndroidDuetMediaPipeGpuGraphSession.kt"
    exclude "com/connects/vanguard_media_engine/diagnostics/AndroidGreenScreenQuantLabSmokeCoordinator.kt"
    exclude "**/AndroidGreenScreenQuantLabSmokeCoordinator.kt"
    exclude "com/connects/vanguard_media_engine/greenscreen/AndroidGreenScreenQuantLabRecorder.kt"
    exclude "**/AndroidGreenScreenQuantLabRecorder.kt"
    exclude "com/connects/vanguard_media_engine/greenscreen/AndroidGreenScreenGpuPipeline.kt"
    exclude "**/AndroidGreenScreenGpuPipeline.kt"
    exclude "com/connects/vanguard_media_engine/greenscreen/AndroidGreenScreenGpuTextureBridge.kt"
    exclude "**/AndroidGreenScreenGpuTextureBridge.kt"
    exclude "com/connects/vanguard_media_engine/greenscreen/AndroidGreenScreenMediaPipeGpuGraphSession.kt"
    exclude "**/AndroidGreenScreenMediaPipeGpuGraphSession.kt"
}

// ── CameraX dependencies (B2: Android camera pipeline) ───────────────────────
// CameraX 1.5.3 is the Android 16 KB page-size compatibility baseline currently
// used for Android camera pipeline, preserving minSdk 24 and avoiding a
// CameraX 2.x migration.
//
// camera-core  : ProcessCameraProvider, CameraSelector, use-case base types
// camera-camera2 : Camera2 backend implementation (required at runtime)
// camera-lifecycle : bindToLifecycle() + LifecycleCameraController
// camera-video : Recorder, VideoCapture<Recorder>, PendingRecording
//
// These are compileOnly in the plugin; the app includes them at link time.
// If the consuming app targets API 34+ and uses CameraX 1.4+, it must override
// these versions. 1.5.3 is the Android 16 KB page-size compatible CameraX 1.x
// baseline while preserving minSdk 24 APIs.
dependencies {
    implementation("androidx.camera:camera-core:1.5.3")
    implementation("androidx.camera:camera-camera2:1.5.3")
    implementation("androidx.camera:camera-lifecycle:1.5.3")
    implementation("androidx.camera:camera-video:1.5.3")
    // Guava ListenableFuture for ProcessCameraProvider.getInstance()
    implementation("com.google.guava:guava:33.0.0-android")

    // -- AndroidX Media3 (Phase 4C1B: HLS / LL-HLS / DASH adaptive streaming) --
    // Stable 1.11.0 - unified versioning across all media3 artifacts.
    // media3-exoplayer    : core ExoPlayer player engine
    // media3-exoplayer-hls: HLS (m3u8) + LL-HLS manifest parsing and buffering
    // media3-exoplayer-dash: DASH MPD parsing, multi-period, chunked CMAF
    // media3-common       : shared MediaItem, Player, MimeTypes, Format types
    implementation("androidx.media3:media3-exoplayer:1.11.0")
    implementation("androidx.media3:media3-exoplayer-hls:1.11.0")
    implementation("androidx.media3:media3-exoplayer-dash:1.11.0")
    implementation("androidx.media3:media3-common:1.11.0")

    // -- Phase 4C6B: Media3 read-through playback cache substrate --
    // media3-datasource : CacheDataSource, CacheDataSource.Factory, DefaultHttpDataSource
    // media3-database   : StandaloneDatabaseProvider (SQLite-backed SimpleCache index)
    // Both pinned to the same 1.11.0 stable line as all other media3 artifacts above.
    implementation("androidx.media3:media3-datasource:1.11.0")
    implementation("androidx.media3:media3-database:1.11.0")

    // -- Phase 5 Unit G: native HEIC still-image encode (AndroidImageOptimizer) --
    // Official stable AndroidX HeifWriter, wrapping android.media.HeifWriter
    // (hidden framework class) with a public API. 1.0.0 is retained as the
    // baseline AndroidX HeifWriter dependency; its manifest still declares
    // minSdk 28, which is handled by the example app's targeted
    // tools:overrideLibrary rather than by raising this plugin's minSdk 24.
    // Runtime use of HeifWriter itself remains gated to API 28+.
    implementation("androidx.heifwriter:heifwriter:1.0.0")

    // -- Duet green-screen: segmentation backend ladder --------------------------
    // Primary: MediaPipe Tasks Vision ImageSegmenter (CPU delegate, VIDEO running
    // mode) driven by the bundled `assets/selfie_segmenter.tflite`. Pinned exactly;
    // GPU delegate is deferred to a later slice.
    implementation("com.google.mediapipe:tasks-vision:0.10.26.1")
    // Fallback: ML Kit Selfie Segmentation (stream mode, raw mask). beta6 is the
    // baseline that ships the raw-mask API (enableRawSizeMask) without pulling in
    // TFLite directly. Terminal fallback after ML Kit is safe PiP (no segmenter).
    implementation("com.google.mlkit:segmentation-selfie:16.0.0-beta6")

    // -- raw_tflite_gpu opt-in backend (debug/smoke only; not default primary) --
    // Standalone TensorFlow Lite + GPU delegate at the version proven by the
    // example probe. GpuDelegate (tensorflow-lite-gpu) requires the API jar
    // (tensorflow-lite-gpu-api) and the core runtime (tensorflow-lite).
    // These three must be pinned to the exact same patch version.
    implementation("org.tensorflow:tensorflow-lite:2.17.0")
    implementation("org.tensorflow:tensorflow-lite-gpu:2.17.0")
    implementation("org.tensorflow:tensorflow-lite-gpu-api:2.17.0")
}
