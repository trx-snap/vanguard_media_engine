// The Android Gradle Plugin builds the native code with the Android NDK.

group = "com.connects.vanguard_media_engine"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.connects.vanguard_media_engine"

    // Bumping the plugin compileSdk version requires all clients of this plugin
    // to bump the version in their app.
    compileSdk = 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specific NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion = android.ndkVersion

    // Invoke the shared CMake build with the Android Gradle Plugin.
    externalNativeBuild {
        cmake {
            path = "../src/CMakeLists.txt"

            // The default CMake version for the Android Gradle Plugin is 3.10.2.
            // https://developer.android.com/studio/projects/install-ndk#vanilla_cmake
            //
            // The Flutter tooling requires that developers have CMake 3.10 or later
            // installed. You should not increase this version, as doing so will cause
            // the plugin to fail to compile for some customers of the plugin.
            // version "3.10.2"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
    }
}

// ── CameraX dependencies (B2: Android camera pipeline) ───────────────────────
// CameraX 1.5.3 is the Android 16 KB page-size compatibility baseline currently
// used for Android camera pipeline, preserving minSdk 24 and avoiding a
// CameraX 2.x migration.
//
// camera-core  : ProcessCameraProvider, CameraSelector, use-case base types
// camera-camera2 : Camera2 backend implementation (required at runtime)
// camera-lifecycle : bindToLifecycle() + LifecycleCameraController
// camera-video : Recorder, VideoCapture<Recorder>, PendingRecording
//
// These are compileOnly in the plugin; the app includes them at link time.
// If the consuming app targets API 34+ and uses CameraX 1.4+, it must override
// these versions. 1.5.3 is the Android 16 KB page-size compatible CameraX 1.x
// baseline while preserving minSdk 24 APIs.
dependencies {
    implementation("androidx.camera:camera-core:1.5.3")
    implementation("androidx.camera:camera-camera2:1.5.3")
    implementation("androidx.camera:camera-lifecycle:1.5.3")
    implementation("androidx.camera:camera-video:1.5.3")
    // Guava ListenableFuture for ProcessCameraProvider.getInstance()
    implementation("com.google.guava:guava:33.0.0-android")

    // -- AndroidX Media3 (Phase 4C1B: HLS / LL-HLS / DASH adaptive streaming) --
    // Stable 1.11.0 - unified versioning across all media3 artifacts.
    // media3-exoplayer    : core ExoPlayer player engine
    // media3-exoplayer-hls: HLS (m3u8) + LL-HLS manifest parsing and buffering
    // media3-exoplayer-dash: DASH MPD parsing, multi-period, chunked CMAF
    // media3-common       : shared MediaItem, Player, MimeTypes, Format types
    implementation("androidx.media3:media3-exoplayer:1.11.0")
    implementation("androidx.media3:media3-exoplayer-hls:1.11.0")
    implementation("androidx.media3:media3-exoplayer-dash:1.11.0")
    implementation("androidx.media3:media3-common:1.11.0")

    // -- Phase 4C6B: Media3 read-through playback cache substrate --
    // media3-datasource : CacheDataSource, CacheDataSource.Factory, DefaultHttpDataSource
    // media3-database   : StandaloneDatabaseProvider (SQLite-backed SimpleCache index)
    // Both pinned to the same 1.11.0 stable line as all other media3 artifacts above.
    implementation("androidx.media3:media3-datasource:1.11.0")
    implementation("androidx.media3:media3-database:1.11.0")

    // -- Phase 5 Unit G: native HEIC still-image encode (AndroidImageOptimizer) --
    // Official stable AndroidX HeifWriter, wrapping android.media.HeifWriter
    // (hidden framework class) with a public API. 1.0.0 is retained as the
    // baseline AndroidX HeifWriter dependency; its manifest still declares
    // minSdk 28, which is handled by the example app's targeted
    // tools:overrideLibrary rather than by raising this plugin's minSdk 24.
    // Runtime use of HeifWriter itself remains gated to API 28+.
    implementation("androidx.heifwriter:heifwriter:1.0.0")
}
