daemon off;
worker_processes 1;
pid /private/tmp/vg-native-precision-20261020/results/nginx.pid;
error_log /private/tmp/vg-native-precision-20261020/results/nginx_error.log debug;
events { worker_connections 256; }
http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format h2_audit '$time_iso8601 client=$remote_addr protocol=$server_protocol http3=$http3 ssl_proto=$ssl_protocol ssl_cipher=$ssl_cipher method=$request_method uri="$request_uri" status=$status bytes=$body_bytes_sent request_time=$request_time ua="$http_user_agent" msec=$msec connection=$connection request_id=$request_id';
    access_log /private/tmp/vg-native-precision-20261020/results/nginx_access.log h2_audit;
    server {
        listen 192.168.0.136:18445 ssl;
        http2 on;
        ssl_certificate /tmp/connects-egress-h3-stage-20261018_192200/certs/fullchain.crt;
        ssl_certificate_key /tmp/connects-egress-h3-stage-20261018_192200/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        location /media/ {
            proxy_pass http://127.0.0.1:18080/media/;
            proxy_http_version 1.1;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off; proxy_cache off; proxy_no_cache 1; proxy_cache_bypass 1;
            proxy_read_timeout 300s; proxy_send_timeout 300s; proxy_connect_timeout 5s;
        }
        location /live/ {
            proxy_pass http://127.0.0.1:18080/live/;
            proxy_http_version 1.1;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off; proxy_cache off; proxy_no_cache 1; proxy_cache_bypass 1;
            proxy_read_timeout 300s; proxy_send_timeout 300s; proxy_connect_timeout 5s;
        }
    }
}
